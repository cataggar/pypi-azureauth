[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "azureauth-bin"
dynamic = ["version"]
description = "DEPRECATED: Use 'ghr install azuread/microsoft-authentication-cli@0.9.7' instead (https://cataggar.github.io/ghr/)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 7 - Inactive",
]

[project.urls]
Homepage = "https://github.com/AzureAD/microsoft-authentication-cli"
Repository = "https://github.com/cataggar/pypi-azureauth"

[project.scripts]
azureauth = "azureauth_bin:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["python/azureauth_bin"]
